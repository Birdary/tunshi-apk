name: Build Tunshi APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Fix permissions
        run: chmod +x gradlew tools/*.sh app/jni/*.sh app/jni/mkxp-z/*.sh || true

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/Android/Sdk
            ~/.cache/android
          key: android-sdk-23.2.8568313-v1

      - name: Env info
        run: |
          echo "cpu: $(nproc)"; free -m | head -2; df -h / | tail -1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - name: Install build environment
        id: setup
        continue-on-error: true
        run: |
          set -o pipefail
          bash tools/setup.sh 2>&1 | tee setup.log
          echo "setup_exit=$?" >> setup.log

      - name: Prune ruby bundled-gem exts
        if: steps.setup.outcome == 'success'
        run: |
          rm -rf app/jni/ruby/ext/cgi app/jni/ruby/ext/bigdecimal || true
          echo "ext dirs:"; ls app/jni/ruby/ext | tr '\n' ' '; echo

      - name: Build APK (arm64-v8a, strip audio)
        id: build
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash tools/build.sh ./game --strip-audio 2>&1 | tee build.log
          echo "build_exit=$?" >> build.log
          df -h / | tail -1 >> build.log
          free -m | head -2 >> build.log

      - name: Save logs to repo
        if: always()
        run: |
          {
            echo "setup=${{ steps.setup.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo
            echo "===== errors (build) ====="
            grep -n -iE "error:|Error [0-9]|No space left|Killed|undefined reference|\*\*\*" build.log 2>/dev/null | tail -n 50 || echo "(none)"
            echo
            echo "===== build.log last 60 lines ====="
            tail -n 260 build.log 2>/dev/null || echo "(no build.log)"
            echo
            echo "===== setup.log last 30 lines ====="
            tail -n 30 setup.log 2>/dev/null || echo "(no setup.log)"
          } > build-log.txt
          git config user.name "ci"
          git config user.email "ci@local"
          git add build-log.txt
          git commit -m "ci log [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tunshi-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

